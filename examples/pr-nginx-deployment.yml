# configmap.yaml
...
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
 default.conf: |
   server {
       listen 80;
       server_name nginx.local;

       location / {
           root /usr/share/nginx/html;
           index index.html index.htm;
       }
   }
